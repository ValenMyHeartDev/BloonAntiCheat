settings:
  prefix: "&8[&cBloonAC&8]"

punishments:
  triggerbot:
    enabled: true
    buffer-threshold: 6.0
    command: "kick %player% TriggerBot detectado"

checks:
  TriggerBot:
    enabled: true
    buffer-decay-per-second: 0.25
  autoclicker:
    enabled: true
    max-cps: 18
  fly:
    enabled: true
  reach:
    enabled: true
    max-distance: 4.2

# Entradas visuales que aparecen en /bloon menu o /bloon sanciones.
sanctions:
  ejemplo:
    name: "&cEjemplo de sanción"
    material: PLAYER_HEAD
    owner: Notch
    lore:
      - "&7Ejemplo de entrada"
      - "&eConfigúrala en config.yml"
    command: "say Sanción de ejemplo para %player%"
