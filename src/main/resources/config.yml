# ==============================================================================
#                 BLOON ANTICHEAT (BloonAC) 
# ==============================================================================
# Calibrado profesionalmente para máxima detección con cero falsos positivos.

settings:
  prefix: "&8[&cBloonAC&8] "
  alerts-permission: "bloon.alerts"
  admin-permission: "bloon.admin"
  check-op-players: true
  min-tps-threshold: 16.5

checks:
  combat:
    reach:
      enabled: true
      max-reach-distance: 3.05
      max-violations: 10
      punishment-command: "bloon banear %player%"
    packet-reach:
      enabled: true
      max-reach: 3.05
      max-violations: 7
      punishment-command: "bloon banear %player%"
    killaura:
      enabled: true
      max-yaw-rate: 175.0
      max-violations: 8
      punishment-command: "bloon banear %player%"
    autoclicker:
      enabled: true
      max-cps: 18
      max-violations: 12
      punishment-command: "bloon banear %player%"
    criticals:
      enabled: true
      strict-ground-check: true
      max-violations: 6
      punishment-command: "bloon banear %player%"
    triggerbot:
      enabled: true
      min-aim-delay-ms: 45
      max-violations: 7
      punishment-command: "bloon banear %player%"
    multiaura:
      enabled: true
      max-violations: 5
      punishment-command: "bloon banear %player%"

  movement:
    fly:
      enabled: true
      max-violations: 8
      punishment-command: "bloon banear %player%"
    speed:
      enabled: true
      max-ground-speed: 0.33
      account-for-ice: true
      max-violations: 10
      punishment-command: "bloon banear %player%"
    clicktp:
      enabled: true
      max-violations: 3
      punishment-command: "bloon banear %player%"
    nofall:
      enabled: true
      force-damage: true
      min-fall-distance: 3.0
      max-violations: 5
      punishment-command: "bloon banear %player%"
    jesus:
      enabled: true
      cancel-water-walk: true
      max-violations: 6
      punishment-command: "bloon banear %player%"
    noslow:
      enabled: true
      max-violations: 6
      punishment-command: "bloon banear %player%"

  player:
    fasteat:
      enabled: true
      min-consume-time-ms: 1400
      max-violations: 5
      punishment-command: "bloon banear %player%"
    timer:
      enabled: true
      max-violations: 8
      punishment-command: "bloon banear %player%"
    inventory:
      enabled: true
      min-click-delay-ms: 70
      max-violations: 7
      punishment-command: "bloon banear %player%"
    badpackets:
      enabled: true
      max-violations: 3
      punishment-command: "bloon banear %player%"
    fastplace:
      enabled: true
      max-violations: 8
      punishment-command: "bloon banear %player%"

sanctions-system:
  auto-ip-ban: true
  default-ban-duration: "30 Días"
  default-ban-reason: "Detección Automática (BloonAC)"
