# ===================================================
#           BLOON ANTICHEAT V1 - CONFIG
# ===================================================

settings:
  prefix: "&8[&cBloonAC&8]"
  debug-mode: false

# Configuración global de castigos y umbrales de advertencia
punishments:
  triggerbot:
    enabled: true
    action: "kick %player% &c[BloonAC] Uso de TriggerBot detectado"
  killaura:
    enabled: true
    action: "kick %player% &c[BloonAC] Uso de KillAura / Reach detectado"
  fly:
    enabled: true
    action: "kick %player% &c[BloonAC] Vuelo ilegal detectado"

# ---------------------------------------------------
# MÓDULOS DE VERIFICACIÓN Y HACKS
# ---------------------------------------------------
checks:
  # 1. Combate y PvP Moderno
  combat:
    killaura: true
    aimassist: true
    autoclicker:
      enabled: true
      max-cps: 16
    reach:
      enabled: true
      max-distance: 3.8
    velocity: true
    antiknockback: true
    criticals: true
    triggerbot: true
    crystalaura: true
    anchoraura: true
    bedaura: true
    shieldbreak: true
    autototem: true
    autoarmor: true

  # 2. Movimiento y Física (Fly, Speed, Scaffold, etc.)
  movement:
    fly:
      enabled: true
      strict-mode: true
    speed: true
    timer: true
    nofall: true
    step: true
    longjump: true
    spider: true
    phase: true
    noslow: true
    scaffold: true
    blink: true
    packetfly: true

  # 3. Interacciones y Jugador
  player:
    fastplace: true
    fastbreak: true
    nuker: true
    xray: true
    freecam: true

  # 4. Exploits y Seguridad de Paquetes (Anti-Crash y Anticheat Bypass)
  exploits:
    badpackets: true
    pingspoof: true
    groundspoof: true
    rotationspoof: true
    crash-exploit: true
    packet-crash: true
    nbt-exploit: true
    chunk-crash: true
    login-flood: true
    dupe-exploit: true
    command-injection: true
    anticheat-bypass: true

  # 5. Visuales / Cliente (Opcionales)
  visuals:
    playeresp: true
    tracers: true

# ---------------------------------------------------
# MENÚ DE SANCIONES Y GUI DE ADMINISTRACIÓN (/bloon sanciones)
# ---------------------------------------------------
sanctions:
  kick_player:
    name: "&eExpulsar Jugador"
    material: FEATHER
    lore:
      - "&7Haz clic para expulsar"
      - "&7al jugador seleccionado."
    command: "kick %player% &cExpulsado por los administradores."
    
  ban_player:
    name: "&cBanear Permanentemente"
    material: NETHERITE_SWORD
    lore:
      - "&7Aplica un baneo permanente"
      - "&7por uso de hacks confirmados [V]."
    command: "ban %player% &c[BloonAC] Bateado por uso de trampas."
