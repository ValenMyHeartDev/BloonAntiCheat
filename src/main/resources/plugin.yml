name: BloonAntiCheat
version: 1.0.0
main: com.bloon.anticheat.Main
api-version: '1.20'
author: Bloon
description: Premier professional-grade administration and detection suite for Minecraft servers.
depend: [packetevents]

commands:
  bloon:
    description: Comando principal de administración de Bloon AntiCheat.
    usage: /bloon <help|menu|sanciones|globals|banear|ignore|freeze|reload>
    permission: bloon.admin
    permission-message: "§c[BloonAC] No tienes permisos para ejecutar este comando."

permissions:
  bloon.admin:
    description: Permite el acceso total a la administración, comandos y GUIs de BloonAC.
    default: op
  bloon.alerts:
    description: Permite recibir alertas e infracciones (VL) de jugadores en tiempo real.
    default: op
